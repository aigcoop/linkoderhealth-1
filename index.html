<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>지쿱 제품 이미지 · 성분표 · 링크오더 보관소 (건강 + 뷰티·생활)</title>
  <style>
    :root {
      --bg:#f8fafc; --paper:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
      --brand:#4f46e5; --brand2:#6366f1; --green:#10b981; --rose:#f43f5e; --amber:#f59e0b;
      --shadow:0 10px 30px rgba(15,23,42,.08); --shadow2:0 18px 60px rgba(15,23,42,.18);
      --radius:22px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent; }
    a { color:inherit; }
    button,input,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    .app { min-height:100vh; padding-bottom:80px; }
    .topbar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); box-shadow:0 4px 18px rgba(15,23,42,.05); }
    .top-inner { max-width:1180px; margin:0 auto; padding:14px 16px 10px; }
    .brand-row { display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .brand-left { display:flex; min-width:0; gap:10px; align-items:center; }
    .logo { width:38px; height:38px; border-radius:13px; display:grid; place-items:center; background:linear-gradient(135deg,var(--brand),#7c3aed); color:#fff; box-shadow:0 9px 18px rgba(79,70,229,.28); flex:0 0 auto; }
    .title-wrap { min-width:0; }
    h1 { margin:0; font-size:15px; line-height:1.25; font-weight:900; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .subtitle { margin-top:3px; color:var(--muted); font-size:11px; font-weight:700; }
    .header-actions { display:flex; gap:8px; align-items:center; flex:0 0 auto; }
    .pill-btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; border-radius:999px; padding:8px 11px; font-size:11px; font-weight:900; text-decoration:none; white-space:nowrap; transition:.18s ease; }
    .pill-green { background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; }
    .pill-indigo { background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; }
    .pill-btn:active,.card:active,.small-btn:active,.tab:active { transform:scale(.97); }
    .search-wrap { max-width:1180px; margin:0 auto; padding:8px 16px 12px; }
    .search-box { position:relative; }
    .search-box input { width:100%; border:1px solid var(--line); background:#fff; border-radius:18px; padding:13px 44px; outline:none; font-size:14px; font-weight:700; box-shadow:0 4px 14px rgba(15,23,42,.04); }
    .search-box input:focus { border-color:#a5b4fc; box-shadow:0 0 0 4px rgba(99,102,241,.12); }
    .search-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#94a3b8; }
    .clear-btn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:999px; background:#f1f5f9; color:#64748b; display:none; }
    .clear-btn.show { display:grid; place-items:center; }
    .catbar { border-top:1px solid #f1f5f9; overflow-x:auto; white-space:nowrap; scrollbar-width:none; padding:10px 16px 12px; max-width:1180px; margin:0 auto; }
    .catbar::-webkit-scrollbar { display:none; }
    .groupbar { max-width:1180px; margin:0 auto; padding:0 16px 10px; display:flex; gap:6px; }
    .group-btn { flex:1 1 0; padding:10px 6px; border-radius:14px; background:#f1f5f9; color:#475569; font-size:13px; font-weight:900; transition:.18s ease; }
    .group-btn.active { background:var(--ink); color:#fff; box-shadow:0 8px 18px rgba(15,23,42,.18); }
    .group-btn small { font-weight:800; opacity:.7; margin-left:3px; }
    .cat-btn { display:inline-flex; margin-right:7px; border-radius:999px; padding:8px 13px; background:#fff; border:1px solid var(--line); color:#475569; font-size:12px; font-weight:900; box-shadow:0 3px 10px rgba(15,23,42,.03); }
    .cat-btn.active { background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:0 8px 18px rgba(79,70,229,.22); }
    .container { max-width:1180px; margin:0 auto; padding:22px 12px 80px; }
    .summary-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 4px 14px; }
    .count { color:var(--muted); font-size:12px; font-weight:900; }
    .sort-select { border:1px solid var(--line); background:#fff; padding:8px 10px; border-radius:12px; color:#475569; font-size:12px; font-weight:800; outline:none; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    @media (min-width:640px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; } }
    @media (min-width:980px) { .grid { grid-template-columns:repeat(6,minmax(0,1fr)); gap:14px; } }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 4px 14px rgba(15,23,42,.04); transition:.18s ease; position:relative; }
    .card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
    .thumb { aspect-ratio:4/5; background:#e2e8f0; position:relative; overflow:hidden; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:.25s ease; }
    .card:hover .thumb img { transform:scale(1.035); }
    .img-fallback { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:10px; color:#94a3b8; background:linear-gradient(135deg,#f8fafc,#e2e8f0); font-size:11px; font-weight:900; }
    .card-body { padding:9px 8px 10px; min-height:66px; text-align:center; }
    .cat-label { color:var(--brand); font-size:9px; font-weight:900; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-title { margin:0; font-size:11px; line-height:1.3; font-weight:900; letter-spacing:-.04em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .download-mini { position:absolute; right:6px; top:6px; z-index:2; width:30px; height:30px; border-radius:11px; color:#fff; background:rgba(79,70,229,.92); display:grid; place-items:center; box-shadow:0 8px 18px rgba(15,23,42,.2); opacity:0; transition:.18s ease; }
    .card:hover .download-mini { opacity:1; }
    @media (hover:none) { .download-mini { opacity:1; } }
    .empty { padding:80px 20px; text-align:center; color:#94a3b8; font-weight:900; }
    .modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(2,6,23,.66); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:14px; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(760px,100%); max-height:88vh; background:#fff; border-radius:30px; overflow:hidden; box-shadow:var(--shadow2); display:flex; flex-direction:column; animation:pop .16s ease-out; }
    @keyframes pop { from { transform:scale(.97); opacity:.2; } to { transform:scale(1); opacity:1; } }
    .modal-head { padding:22px 22px 0; text-align:center; border-bottom:1px solid #f1f5f9; }
    .modal-close { position:absolute; right:18px; top:18px; width:38px; height:38px; border-radius:999px; background:#f1f5f9; color:#475569; display:grid; place-items:center; }
    .modal-title-area { position:relative; padding-right:44px; padding-left:44px; }
    .modal-cat { display:inline-flex; background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; border-radius:999px; padding:4px 9px; font-size:10px; font-weight:900; margin-bottom:8px; }
    .modal h2 { margin:0 0 14px; font-size:20px; line-height:1.25; letter-spacing:-.045em; }
    .tabs { display:flex; gap:0; }
    .tab { flex:1; background:#fff; color:#94a3b8; border-bottom:2px solid transparent; padding:14px 4px; font-size:12px; font-weight:900; }
    .tab.active { color:var(--brand); border-bottom-color:var(--brand); }
    .modal-body { flex:1; overflow:auto; background:#fbfdff; padding:20px; }
    .modal-foot { padding:12px; text-align:center; border-top:1px solid #f1f5f9; color:#94a3b8; font-size:10px; font-weight:900; letter-spacing:.04em; }
    .image-grid { display:grid; grid-template-columns:1fr; gap:14px; }
    @media (min-width:600px) { .image-grid { grid-template-columns:repeat(2,1fr); } }
    .image-tile { position:relative; border-radius:22px; overflow:hidden; background:#fff; border:1px solid var(--line); box-shadow:0 6px 16px rgba(15,23,42,.08); }
    .image-tile .thumb { aspect-ratio:1/1; cursor:pointer; }
    .image-badge { position:absolute; top:10px; left:10px; z-index:2; border-radius:999px; background:rgba(15,23,42,.62); color:#fff; font-size:10px; font-weight:900; padding:5px 9px; backdrop-filter:blur(8px); }
    .image-save { position:absolute; right:10px; bottom:10px; z-index:2; width:38px; height:38px; border-radius:14px; background:rgba(255,255,255,.92); color:var(--brand); box-shadow:0 8px 18px rgba(15,23,42,.18); }
    .section-card { background:#fff; border:1px solid #eef2f7; border-radius:26px; padding:20px; box-shadow:0 6px 20px rgba(15,23,42,.04); margin-bottom:15px; }
    .section-title { display:flex; justify-content:center; align-items:center; gap:8px; margin:0 0 13px; color:var(--brand); font-size:12px; font-weight:1000; text-transform:uppercase; letter-spacing:.06em; }
    .dot { width:7px; height:7px; background:currentColor; border-radius:50%; }
    .desc { white-space:pre-line; margin:0; color:#334155; text-align:center; line-height:1.75; font-size:14px; font-weight:650; }
    .point-list { display:flex; flex-direction:column; gap:8px; align-items:center; }
    .point { width:100%; border-radius:16px; padding:10px 12px; background:#f8fafc; border:1px solid #edf2f7; text-align:center; color:#475569; font-size:13px; font-weight:850; }
    .notice { color:#94a3b8; text-align:center; font-size:11px; font-weight:800; line-height:1.6; }
    .url-card { background:#eef2ff; border:1px solid #c7d2fe; border-radius:24px; padding:16px; margin-bottom:18px; text-align:center; }
    .url-text { word-break:break-all; color:#475569; font-size:11px; line-height:1.5; margin:8px 0 12px; }
    .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
    .small-btn { flex:1; min-width:90px; display:inline-flex; align-items:center; justify-content:center; gap:5px; border-radius:14px; padding:10px 12px; background:#fff; color:#475569; border:1px solid var(--line); font-size:11px; font-weight:900; transition:.14s ease; }
    .small-btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
    .small-btn.green { background:#ecfdf5; border-color:#a7f3d0; color:#047857; }
    .small-btn.rose { background:#fff1f2; border-color:#fecdd3; color:#be123c; flex:0 0 auto; }
    .link-item { background:#fff; border:1px solid #edf2f7; border-radius:22px; padding:14px; margin-bottom:12px; box-shadow:0 6px 14px rgba(15,23,42,.035); }
    .field { width:100%; border:1px solid var(--line); background:#fff; border-radius:14px; padding:11px 12px; outline:none; color:#334155; font-size:13px; font-weight:750; margin-bottom:8px; text-align:center; }
    .field:focus { border-color:#a5b4fc; box-shadow:0 0 0 4px rgba(99,102,241,.12); }
    .custom-panel { max-width:650px; margin:0 auto; }
    .custom-form { background:#fff; border:1px solid #dbeafe; border-radius:30px; box-shadow:var(--shadow); padding:20px; margin-bottom:18px; }
    .custom-title { display:flex; align-items:center; justify-content:center; gap:8px; margin:0 0 16px; font-size:17px; font-weight:1000; letter-spacing:-.04em; }
    .custom-item { background:#fff; border:1px solid var(--line); border-radius:24px; padding:16px; margin-bottom:12px; box-shadow:0 6px 16px rgba(15,23,42,.04); text-align:center; }
    .custom-item h3 { margin:0 0 6px; color:var(--brand); font-size:14px; font-weight:1000; }
    .custom-item p { margin:0 0 12px; color:#94a3b8; font-size:12px; word-break:break-all; }
    .fullscreen { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center; padding:18px; }
    .fullscreen.open { display:flex; }
    .fullscreen img { max-width:100%; max-height:100%; object-fit:contain; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .fullscreen .modal-close { color:#fff; background:rgba(255,255,255,.14); top:16px; right:16px; position:absolute; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; z-index:300; background:rgba(15,23,42,.92); color:#fff; border-radius:18px; padding:13px 18px; box-shadow:var(--shadow2); font-size:12px; font-weight:900; display:flex; align-items:center; gap:8px; transition:.18s ease; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media (max-width:540px) {

      .modal-title-area { padding-left:18px; padding-right:44px; }

</head>

    const CATEGORY_ORDER = ["전체보기", "케어세르브 웨이브 플러스", "영양건강", "텔로메라GK,정", "디엘릭서", "의료기기", "텔로메라화장품", "케어셀라 뷰티", "바이오케이", "컬러오리진염색약", "리빙", "기타"];
    const GROUPS = ["전체", "건강", "뷰티·생활"];
    const SHOP_URL = "https://vcshop.gcoop.com/kr";
    const FALLBACK_URL = "https://vcshop.gcoop.com/kr/display?cate=7&itemNo=3189";

    const state = {
      group: "전체",
      category: "전체보기",
      query: "",
      sort: "default",
      selected: null,
      tab: "images",
      editingCustomId: null,
      customLinks: [],
      personalLinks: {}
    };

    const $ = (id) => document.getElementById(id);
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };

    function safeUrl(url) {
      const value = String(url || "").trim();
      if (!value) return "";
      if (/^(https?:|mailto:|tel:)/i.test(value)) return value;
      return "https://" + value;
    }

    const KEY_PERSONAL = "gcoop_merged_personalLinks_v1";
    const KEY_CUSTOM = "gcoop_merged_customLinks_v1";

    function saveStorage() {
      try {
        localStorage.setItem(KEY_PERSONAL, JSON.stringify(state.personalLinks));
        localStorage.setItem(KEY_CUSTOM, JSON.stringify(state.customLinks));
      } catch(e) {}
    }

    function readJson(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; }
    }

    // 예전 두 사이트(건강 / 뷰티)에 저장해 둔 링크를 처음 한 번 자동으로 옮겨 옵니다.
    function migrateOld() {
      const personal = {};
      const oldH = readJson("gcoop_promptbook_personalLinks", {}) || {};
      const oldB = readJson("gcoop_personal_links_v2", {}) || {};
      Object.keys(oldH).forEach((id) => { personal["h" + id] = oldH[id]; });
      Object.keys(oldB).forEach((id) => { personal["b" + id] = oldB[id]; });
      const custom = [];
      const seen = new Set();
      [["h", readJson("gcoop_promptbook_customLinks", [])], ["b", readJson("gcoop_custom_links_v2", [])]].forEach(([prefix, list]) => {
        (Array.isArray(list) ? list : []).forEach((item, idx) => {
          if (!item || !item.url || seen.has(item.url)) return;
          seen.add(item.url);
          custom.push({ id: prefix + (item.id || idx) + "_" + idx, name: item.name || "제목 없음", url: item.url });
        });
      });
      return { personal, custom };
    }

    function loadStorage() {
      let hasNew = false;
      try { hasNew = localStorage.getItem(KEY_PERSONAL) !== null || localStorage.getItem(KEY_CUSTOM) !== null; } catch(e) {}
      if (hasNew) {
        state.personalLinks = readJson(KEY_PERSONAL, {}) || {};
        state.customLinks = readJson(KEY_CUSTOM, []) || [];
      } else {
        const moved = migrateOld();
        state.personalLinks = moved.personal;
        state.customLinks = moved.custom;
        if (Object.keys(moved.personal).length || moved.custom.length) saveStorage();
      }
    }

    function toast(message) {
      $("toastMsg").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2300);
    }

    async function copyText(text, label="내용") {
      const value = String(text || "");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        toast(label + " 복사 완료");
      } catch(e) {
        toast("복사에 실패했습니다. 주소를 직접 선택해 주세요.");
      }
    }

    async function shareLink(title, url) {
      const clean = safeUrl(url);
      if (!clean) { toast("공유할 주소가 없습니다."); return; }
      if (navigator.share) {
        try { await navigator.share({ title: title || "공유 링크", url: clean }); } catch(e) { /* 사용자가 취소한 경우 무시 */ }
      } else {
        copyText(clean, "주소");
      }
    }

    function makeImage(src, alt, onClick) {
      const wrap = el("div", "thumb");
      const img = document.createElement("img");
      img.src = src || "";
      img.alt = alt || "이미지";
      img.loading = "lazy";
      img.decoding = "async";
      img.onerror = () => {
        img.remove();
        if (!wrap.querySelector(".img-fallback")) wrap.appendChild(el("div", "img-fallback", "이미지 없음\n" + (src || "")));
      };
      if (onClick) wrap.addEventListener("click", onClick);
      wrap.appendChild(img);
      return wrap;
    }

    function downloadImage(url, filename) {
      if (!url) { toast("저장할 이미지가 없습니다."); return; }
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || url.split("/").pop() || "image.jpg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("이미지 저장을 시작합니다.");
    }

    function downloadAll(product) {
      if (!product || !product.images || !product.images.length) { toast("저장할 이미지가 없습니다."); return; }
      product.images.forEach((src, idx) => {
        setTimeout(() => downloadImage(src, `${product.title}_${idx + 1}.jpg`), idx * 220);
      });
    }

    function productText(product) {
      return [
        product.title, product.group, product.category, product.content, product.ingredients, product.usage,
        ...(product.points || []), ...(product.recommend || [])
      ].join(" ").toLowerCase();
    }

    function filteredProducts() {
      const q = state.query.trim().toLowerCase();
      let list = PRODUCTS.filter((p) => {
        const okCat = (state.group === "전체" || p.group === state.group) && (state.category === "전체보기" || p.category === state.category);
        const okQ = !q || productText(p).includes(q);
        return okCat && okQ;
      });
      if (state.sort === "title") list = list.slice().sort((a,b) => a.title.localeCompare(b.title, "ko"));
      if (state.sort === "category") list = list.slice().sort((a,b) => (a.category + a.title).localeCompare(b.category + b.title, "ko"));
      return list;
    }

    function inGroup(p) { return state.group === "전체" || p.group === state.group; }

    function renderGroups() {
      const bar = $("groupBar");
      bar.innerHTML = "";
      GROUPS.forEach((group) => {
        const count = PRODUCTS.filter((p) => group === "전체" || p.group === group).length;
        const btn = el("button", "group-btn" + (state.group === group ? " active" : ""), group);
        btn.type = "button";
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", state.group === group ? "true" : "false");
        btn.appendChild(el("small", "", String(count)));
        btn.addEventListener("click", () => {
          state.group = group;
          state.category = "전체보기";
          render();
          $("categoryBar").scrollLeft = 0;
        });
        bar.appendChild(btn);
      });
    }

    function renderCategories() {
      const bar = $("categoryBar");
      bar.innerHTML = "";
      const pool = PRODUCTS.filter(inGroup);
      const categories = CATEGORY_ORDER.filter((cat) => cat === "전체보기" || cat === "기타" || pool.some((p) => p.category === cat));
      const extras = [...new Set(pool.map((p) => p.category))].filter((cat) => !categories.includes(cat));
      const ordered = [...categories.filter((c) => c !== "기타"), ...extras, "기타"];
      ordered.forEach((cat) => {
        const label = cat === "기타" ? "🔗 나만의 링크" : cat;
        const btn = el("button", "cat-btn" + (state.category === cat ? " active" : ""), label);
        btn.type = "button";
        btn.addEventListener("click", () => {
          state.category = cat;
          render();
        });
        bar.appendChild(btn);
      });
    }

    function renderProducts() {
      const grid = $("productGrid");
      const empty = $("emptyProducts");
      const list = filteredProducts();
      grid.innerHTML = "";
      $("resultCount").textContent = `${state.group === "전체" ? "" : state.group + " · "}${state.category} · ${list.length}개`;
      empty.classList.toggle("hidden", list.length !== 0);

      list.forEach((product) => {
        const card = el("article", "card");
        const dl = el("button", "download-mini", "↓");
        dl.type = "button";
        dl.title = "이미지 전체 저장";
        dl.addEventListener("click", (ev) => { ev.stopPropagation(); downloadAll(product); });
        card.appendChild(dl);
        card.appendChild(makeImage((product.images || [])[0], product.title));
        const body = el("div", "card-body");
        body.appendChild(el("div", "cat-label", product.category));
        body.appendChild(el("h3", "card-title", product.title));
        card.appendChild(body);
        card.addEventListener("click", () => openModal(product));
        grid.appendChild(card);
      });
    }

    function renderCustomLinks() {
      const list = $("customList");
      list.innerHTML = "";
      $("emptyCustom").classList.toggle("hidden", state.customLinks.length !== 0);
      state.customLinks.forEach((link) => {
        const item = el("div", "custom-item");
        item.appendChild(el("h3", "", link.name || "제목 없음"));
        item.appendChild(el("p", "", link.url || ""));
        const row = el("div", "btn-row");
        const open = el("a", "small-btn green", "열기");
        open.href = safeUrl(link.url); open.target = "_blank"; open.rel = "noopener";
        const edit = el("button", "small-btn", "수정"); edit.type="button";
        edit.addEventListener("click", () => editCustom(link.id));
        const copy = el("button", "small-btn", "복사"); copy.type="button";
        copy.addEventListener("click", () => copyText(link.url, "주소"));
        const share = el("button", "small-btn", "공유"); share.type="button";
        share.addEventListener("click", () => shareLink(link.name, link.url));
        const del = el("button", "small-btn rose", "삭제"); del.type="button";
        del.addEventListener("click", () => {
          state.customLinks = state.customLinks.filter((x) => x.id !== link.id);
          saveStorage(); renderCustomLinks(); toast("링크가 삭제되었습니다.");
        });
        [open, edit, copy, share, del].forEach((node) => row.appendChild(node));
        item.appendChild(row);
        list.appendChild(item);
      });
    }

    function saveCustom() {
      const name = $("customName").value.trim() || "제목 없음";
      const url = $("customUrl").value.trim();
      if (!url) { toast("주소를 입력해 주세요."); return; }
      if (state.editingCustomId) {
        state.customLinks = state.customLinks.map((link) => link.id === state.editingCustomId ? { ...link, name, url } : link);
        state.editingCustomId = null;
        $("saveCustom").textContent = "＋ 나만의 주소 등록하기";
        $("cancelEdit").classList.add("hidden");
        toast("링크가 수정되었습니다.");
      } else {
        state.customLinks.unshift({ id:String(Date.now()), name, url, createdAt:Date.now() });
        toast("새 링크가 등록되었습니다.");
      }
      $("customName").value = ""; $("customUrl").value = "";
      saveStorage(); renderCustomLinks();
    }

    function editCustom(id) {
      const link = state.customLinks.find((x) => x.id === id);
      if (!link) return;
      state.editingCustomId = id;
      $("customName").value = link.name || "";
      $("customUrl").value = link.url || "";
      $("saveCustom").textContent = "✓ 수정 완료";
      $("cancelEdit").classList.remove("hidden");
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    function cancelEdit() {
      state.editingCustomId = null;
      $("customName").value = ""; $("customUrl").value = "";
      $("saveCustom").textContent = "＋ 나만의 주소 등록하기";
      $("cancelEdit").classList.add("hidden");
    }

    function render() {
      renderGroups();
      renderCategories();
      const isCustom = state.category === "기타";
      $("productSection").classList.toggle("hidden", isCustom);
      $("customSection").classList.toggle("hidden", !isCustom);
      $("clearSearch").classList.toggle("show", Boolean(state.query));
      if (isCustom) renderCustomLinks(); else renderProducts();
    }

    function openModal(product) {
      state.selected = product;
      state.tab = "images";
      $("modalCat").textContent = product.category || "제품";
      $("modalTitle").textContent = product.title || "제품 상세";
      $("modalBackdrop").classList.add("open");
      $("modalBackdrop").setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      renderModalTab();
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("open");
      $("modalBackdrop").setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      state.selected = null;
    }

    function setTab(tab) {
      state.tab = tab;
      renderModalTab();
    }

    function renderModalTab() {
      const product = state.selected;
      if (!product) return;
      document.querySelectorAll(".tab").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === state.tab));
      const body = $("modalBody");
      body.innerHTML = "";
      if (state.tab === "images") renderImageTab(body, product);
      if (state.tab === "detail") renderDetailTab(body, product);
      if (state.tab === "links") renderLinksTab(body, product);
    }

    function renderImageTab(body, product) {
      const top = el("div", "btn-row");
      const all = el("button", "small-btn green", "↓ 전체 이미지 저장");
      all.type = "button";
      all.addEventListener("click", () => downloadAll(product));
      top.appendChild(all);
      body.appendChild(top);
      body.appendChild(el("div", "", ""));
      const grid = el("div", "image-grid");
      (product.images || []).forEach((src, idx) => {
        const tile = el("div", "image-tile");
        tile.appendChild(el("div", "image-badge", idx === 0 ? "메인" : idx === 3 ? "상세/성분" : `이미지 ${idx + 1}`));
        tile.appendChild(makeImage(src, `${product.title} 이미지 ${idx + 1}`, () => openFull(src)));
        const save = el("button", "image-save", "↓");
        save.type = "button";
        save.title = "이미지 저장";
        save.addEventListener("click", (ev) => { ev.stopPropagation(); downloadImage(src, `${product.title}_${idx + 1}.jpg`); });
        tile.appendChild(save);
        grid.appendChild(tile);
      });
      if (!product.images || !product.images.length) grid.appendChild(el("div", "empty", "등록된 이미지가 없습니다."));
      body.appendChild(grid);
    }

    function renderDetailTab(body, product) {
      const overview = el("section", "section-card");
      overview.appendChild(sectionTitle("Product Description", "#4f46e5"));
      overview.appendChild(el("p", "desc", product.content || "제품 설명이 등록되지 않았습니다."));
      body.appendChild(overview);

      if (product.points && product.points.length) {
        const points = el("section", "section-card");
        points.appendChild(sectionTitle("Key Points", "#f59e0b"));
        const plist = el("div", "point-list");
        product.points.forEach((txt) => plist.appendChild(el("div", "point", "• " + txt)));
        points.appendChild(plist);
        body.appendChild(points);
      }

      const ing = el("section", "section-card");
      ing.appendChild(sectionTitle("Ingredients / 주요 성분", "#10b981"));
      ing.appendChild(el("p", "desc", product.ingredients || "상세 이미지의 성분표를 통해 전성분을 확인하실 수 있습니다."));
      body.appendChild(ing);

      if (product.usage) {
        const usage = el("section", "section-card");
        usage.appendChild(sectionTitle("How to Use / 섭취·사용 방법", "#4f46e5"));
        usage.appendChild(el("p", "desc", product.usage));
        body.appendChild(usage);
      }

      if (product.recommend && product.recommend.length) {
        const rec = el("section", "section-card");
        rec.appendChild(sectionTitle("Recommended For", "#f59e0b"));
        const list = el("div", "point-list");
        product.recommend.forEach((txt, idx) => list.appendChild(el("div", "point", `${idx + 1}. ${txt}`)));
        rec.appendChild(list);
        body.appendChild(rec);
      }
      body.appendChild(el("p", "notice", "※ 건강기능식품·의료기기·화장품 관련 표현과 전성분, 주의사항은 공식 상세페이지와 제품 라벨을 기준으로 확인해 주세요."));
    }

    function sectionTitle(text, color) {
      const h = el("h3", "section-title");
      h.style.color = color;
      h.appendChild(el("span", "dot"));
      h.appendChild(document.createTextNode(text));
      return h;
    }

    function renderLinksTab(body, product) {
      const mallLinks = (product.links && product.links.length) ? product.links : [{ label:"쇼핑몰 상세페이지", url:FALLBACK_URL }];
      mallLinks.forEach((link) => {
        const url = link.url;
        const fixed = el("section", "url-card");
        fixed.appendChild(el("strong", "", link.label || "쇼핑몰 상세페이지"));
        fixed.appendChild(el("p", "url-text", url));
        const row = el("div", "btn-row");
        const open = el("a", "small-btn green", "열기");
        open.href = safeUrl(url); open.target = "_blank"; open.rel = "noopener";
        const share = el("button", "small-btn", "공유"); share.type = "button";
        share.addEventListener("click", () => shareLink(link.label && mallLinks.length > 1 ? link.label : product.title, url));
        const copy = el("button", "small-btn", "복사"); copy.type = "button";
        copy.addEventListener("click", () => copyText(url, "상세페이지 주소"));
        [open, share, copy].forEach((node) => row.appendChild(node));
        fixed.appendChild(row);
        body.appendChild(fixed);
      });

      const title = el("p", "notice", "개인 등록 링크 5개 · 현재 기기에만 저장됩니다.");
      body.appendChild(title);
      for (let i = 1; i <= 5; i++) {
        body.appendChild(makePersonalLinkItem(product, i));
      }
    }

    function makePersonalLinkItem(product, index) {
      const key = String(product.id);
      const saved = (state.personalLinks[key] || {})["link" + index] || { name:`링크 ${index}`, url:"" };
      const box = el("div", "link-item");
      const name = document.createElement("input");
      name.className = "field"; name.type = "text"; name.value = saved.name || `링크 ${index}`; name.placeholder = "이름 입력";
      const url = document.createElement("input");
      url.className = "field"; url.type = "url"; url.value = saved.url || ""; url.placeholder = "마케팅 주소(URL)를 입력하세요";
      const row = el("div", "btn-row");
      const save = el("button", "small-btn primary", saved.url ? "변경" : "등록"); save.type = "button";
      save.addEventListener("click", () => {
        if (!url.value.trim()) { toast("주소를 입력해 주세요."); return; }
        if (!state.personalLinks[key]) state.personalLinks[key] = {};
        state.personalLinks[key]["link" + index] = { name:name.value.trim() || `링크 ${index}`, url:url.value.trim() };
        saveStorage(); toast("링크가 저장되었습니다."); renderModalTab();
      });
      row.appendChild(save);
      if (saved.url) {
        const open = el("a", "small-btn green", "열기"); open.href = safeUrl(saved.url); open.target = "_blank"; open.rel = "noopener";
        const copy = el("button", "small-btn", "복사"); copy.type = "button"; copy.addEventListener("click", () => copyText(saved.url, saved.name || "주소"));
        const share = el("button", "small-btn", "공유"); share.type = "button"; share.addEventListener("click", () => shareLink(saved.name, saved.url));
        const del = el("button", "small-btn rose", "삭제"); del.type = "button";
        del.addEventListener("click", () => {
          if (state.personalLinks[key]) delete state.personalLinks[key]["link" + index];
          saveStorage(); toast("링크가 삭제되었습니다."); renderModalTab();
        });
        [open, copy, share, del].forEach((node) => row.appendChild(node));
      }
      box.appendChild(name); box.appendChild(url); box.appendChild(row);
      return box;
    }

    function openFull(src) {
      if (!src) return;
      $("fullImage").src = src;
      $("fullscreen").classList.add("open");
      $("fullscreen").setAttribute("aria-hidden", "false");
    }

    function closeFull() {
      $("fullscreen").classList.remove("open");
      $("fullscreen").setAttribute("aria-hidden", "true");
      $("fullImage").removeAttribute("src");
    }

    function bindEvents() {
      $("searchInput").addEventListener("input", (e) => { state.query = e.target.value; render(); });
      $("clearSearch").addEventListener("click", () => { state.query = ""; $("searchInput").value = ""; render(); });
      $("sortSelect").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
      $("shareSite").addEventListener("click", () => shareLink("지쿱 공식 쇼핑몰", SHOP_URL));
      $("closeModal").addEventListener("click", closeModal);
      $("modalBackdrop").addEventListener("click", (e) => { if (e.target === $("modalBackdrop")) closeModal(); });
      document.querySelectorAll(".tab").forEach((btn) => btn.addEventListener("click", () => setTab(btn.dataset.tab)));
      $("saveCustom").addEventListener("click", saveCustom);
      $("cancelEdit").addEventListener("click", cancelEdit);
      $("closeFull").addEventListener("click", closeFull);
      $("fullscreen").addEventListener("click", (e) => { if (e.target === $("fullscreen")) closeFull(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeFull(); closeModal(); } });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadStorage(); bindEvents(); render();
      console.log("GCOOP merged hub loaded:", PRODUCTS.length, "products");
    });
  </script>
</body>
</html>
